<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karthik.dev</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Prism for syntax highlighting -->
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.min.css" rel="stylesheet" />

    <style>
    /* 1. AGIFLOW THEME: Typography & Core Layout */
    :root {
        --text-main: #1a1a1a;
        --text-muted: #666666;
        --bg-subtle: #f9f9f9;
        --border-color: #eeeeee;
        --link-color: #0066ff; /* Agiflow uses a subtle blue for some links */
    }

    body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text-main);
        line-height: 1.7; /* Slightly more breathing room for long reads */
        max-width: 720px;  /* NARROWER: This is the "sweet spot" for readability */
        margin: 0 auto;
        padding: 60px 24px;
        background-color: #fff;
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
    }

    /* 2. HEADINGS: Bold and Tight */
    h1, h2, h3, h4 {
        color: #000;
        font-weight: 700;
        letter-spacing: -0.03em; /* Tighter letter spacing for that premium look */
        margin-top: 2.5em;
        margin-bottom: 0.8em;
        line-height: 1.2;
    }

    h1 { font-size: 2.75rem; margin-top: 0; }
    h2 { font-size: 1.8rem; border: none; } /* Removed the heavy underline */
    h3 { font-size: 1.4rem; }

    /* 3. LINKS & NAV: Minimalist */
    a { 
        color: inherit; 
        text-decoration: underline; 
        text-decoration-thickness: 1px; 
        text-underline-offset: 3px; 
        transition: color 0.2s ease;
    }
    
    a:hover { color: var(--link-color); }

    nav { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 80px; 
    }

    nav .logo { 
        font-weight: 700; 
        font-size: 1rem; 
        text-decoration: none; 
        letter-spacing: -0.02em; 
    }

    nav ul { list-style: none; display: flex; gap: 24px; padding: 0; margin: 0; }
    nav ul li a { 
        font-size: 0.9rem; 
        color: var(--text-muted); 
        text-decoration: none; 
        font-weight: 500;
    }

    nav ul li a:hover { color: #000; }

    /* 4. CODE BLOCKS: Submerged Look */
    pre[class*="language-"] {
        background-color: var(--bg-subtle) !important;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 20px;
        margin: 2em 0;
        font-size: 0.85rem;
    }

    :not(pre) > code {
        background-color: var(--bg-subtle);
        color: #d12d61; /* Subtle "code red" seen in many technical blogs */
        padding: 0.2em 0.4em;
        border-radius: 4px;
        font-size: 0.9em;
        font-family: "SFMono-Regular", Consolas, monospace;
    }

    /* 5. METADATA (Dates, Tags) */
    .post-meta {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-bottom: 2rem;
        display: block;
    }

    footer {
        margin-top: 100px;
        padding-top: 40px;
        border-top: 1px solid var(--border-color);
        color: var(--text-muted);
        font-size: 0.85rem;
        text-align: left; /* Aligned left for that modern feel */
    }

    /* Mobile */
    @media (max-width: 600px) {
        body { padding: 40px 20px; }
        h1 { font-size: 2.2rem; }
    }
</style>

    <script>
      window.MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
        svg: { fontCache: 'global' }
      };
    </script>
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
</head>
<body>

    <nav>
        <a href="/" class="logo">karthik.dev</a>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/articles">Articles</a></li>
            <li><a href="/about">About</a></li>
        </ul>
    </nav>

    <article>
        <header>
        <h1>{{ page.title }}</h1>
        {% if page.date %}
            <span class="post-meta">
                {{ page.date | date: "%B %d, %Y" }} • 5 min read
            </span>
        {% endif %}
    </header>

    {{ content }}
    </article>

    <footer>
        &copy; 2026 Karthik.
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>

</body>
</html>
