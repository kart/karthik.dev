<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karthik.dev</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Prism for syntax highlighting -->
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.min.css" rel="stylesheet" />

    <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");
    :root { --text-main: #111111; --text-muted: #666666; --bg-subtle: #f8f9fa; --border-color: #eaeaea; }
    body { font-family: "Inter", -apple-system, sans-serif; color: var(--text-main); line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 80px 40px; background-color: #fff; font-size: 17px; -webkit-font-smoothing: antialiased; }
    nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 100px; }
    nav .logo { font-weight: 700; font-size: 1.1rem; text-decoration: none; letter-spacing: -0.03em; color: #000; }
    nav ul { list-style: none; display: flex; gap: 32px; padding: 0; margin: 0; }
    nav ul li a { font-size: 0.95rem; color: var(--text-muted); text-decoration: none; font-weight: 500; }
    h1 { font-size: 3.2rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; margin-bottom: 1rem; color: #000; }
    .post-meta { font-size: 1rem; color: var(--text-muted); }
    h2 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em; margin-top: 3em; margin-bottom: 1em; }
    pre[class*="language-"] { background-color: var(--bg-subtle) !important; border: 1px solid var(--border-color) !important; border-radius: 12px !important; padding: 24px !important; margin: 2.5em 0 !important; font-size: 0.9rem !important; }
    :not(pre) > code { background-color: #f1f3f5; color: #eb5757; padding: 0.2em 0.4em; border-radius: 4px; font-size: 0.85em; }
    footer { margin-top: 120px; padding-top: 40px; border-top: 1px solid var(--border-color); color: var(--text-muted); }
</style>

    <script>
      window.MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
        svg: { fontCache: 'global' }
      };
    </script>
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
</head>
<body>

    <nav>
        <a href="/" class="logo">karthik.dev</a>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/articles">Articles</a></li>
            <li><a href="/about">About</a></li>
        </ul>
    </nav>

    <article>
        <header>
        <h1>{{ page.title }}</h1>
        {% if page.date %}
            <span class="post-meta">
                {{ page.date | date: "%B %d, %Y" }} • 5 min read
            </span>
        {% endif %}
    </header>

    {{ content }}
    </article>

    <footer>
        &copy; 2026 Karthik.
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>

</body>
</html>
