<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karthik.dev</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Prism for syntax highlighting -->
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.min.css" rel="stylesheet" />

    <style>
    @import url("https://rsms.me/inter/inter.css");
    :root { --text-main: #111111; --text-muted: #666666; --bg-subtle: #f9fafb; --border-color: #eaecf0; }
    html { font-family: "Inter var", sans-serif; font-feature-settings: "cv02", "cv05", "cv11"; }
    body { font-family: "Inter var", sans-serif; color: var(--text-main); line-height: 1.625; max-width: 1200px; margin: 0 auto; padding: 80px 40px; background-color: #fff; font-size: 18px; -webkit-font-smoothing: antialiased; }
    article { max-width: 720px; margin: 0 auto; }
    nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 120px; max-width: 1120px; margin-left: auto; margin-right: auto; }
    nav .logo { font-weight: 800; font-size: 1.25rem; text-decoration: none; letter-spacing: -0.04em; color: #000; }
    nav ul { list-style: none; display: flex; gap: 40px; padding: 0; margin: 0; }
    nav ul li a { font-size: 1rem; color: var(--text-muted); text-decoration: none; font-weight: 500; }
    h1 { font-size: 3.75rem; font-weight: 850; letter-spacing: -0.05em; line-height: 1.1; margin-bottom: 1.5rem; color: #101828; }
    .post-meta { font-size: 1.1rem; color: var(--text-muted); font-weight: 500; margin-bottom: 2.5rem; display: block; letter-spacing: -0.01em; }
    h2 { font-size: 2.25rem; font-weight: 800; letter-spacing: -0.03em; margin-top: 3.5em; margin-bottom: 1.25rem; color: #101828; }
    p { margin-bottom: 1.5rem; letter-spacing: -0.011em; }
    pre[class*="language-"] { background-color: var(--bg-subtle) !important; border: 1px solid var(--border-color) !important; border-radius: 12px !important; padding: 32px !important; margin: 3em 0 !important; font-size: 0.95rem !important; }
    :not(pre) > code { background-color: #f3f4f6; color: #344054; padding: 0.2em 0.4em; border-radius: 6px; font-size: 0.875em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    footer { margin-top: 150px; padding: 60px 0; border-top: 1px solid var(--border-color); color: var(--text-muted); max-width: 720px; margin-left: auto; margin-right: auto; }
</style>

    <script>
      window.MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
        svg: { fontCache: 'global' }
      };
    </script>
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
</head>
<body>

    <nav>
        <a href="/" class="logo">karthik.dev</a>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/articles">Articles</a></li>
            <li><a href="/about">About</a></li>
        </ul>
    </nav>

    <article>
        <header>
        <h1>{{ page.title }}</h1>
        {% if page.date %}
            <span class="post-meta">
                {{ page.date | date: "%B %d, %Y" }} • 5 min read
            </span>
        {% endif %}
    </header>

    {{ content }}
    </article>

    <footer>
        &copy; 2026 Karthik.
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>

</body>
</html>
