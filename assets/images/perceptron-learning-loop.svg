<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#222" />
    </marker>
  </defs>

  <rect x="40" y="60" width="180" height="80" fill="none" stroke="#222" stroke-width="2" />
  <text x="130" y="105" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Input x</text>

  <rect x="260" y="60" width="220" height="80" fill="none" stroke="#222" stroke-width="2" />
  <text x="370" y="95" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Weighted sum</text>
  <text x="370" y="115" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">(w·x + b)</text>

  <rect x="520" y="60" width="200" height="80" fill="none" stroke="#222" stroke-width="2" />
  <text x="620" y="95" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Activation</text>
  <text x="620" y="115" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">(sign)</text>

  <rect x="760" y="60" width="200" height="80" fill="none" stroke="#222" stroke-width="2" />
  <text x="860" y="105" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Prediction ŷ</text>

  <line x1="220" y1="100" x2="260" y2="100" stroke="#222" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="480" y1="100" x2="520" y2="100" stroke="#222" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="720" y1="100" x2="760" y2="100" stroke="#222" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="360" y="170" width="280" height="60" fill="none" stroke="#222" stroke-width="2" />
  <text x="500" y="205" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Error: y − ŷ</text>

  <line x1="500" y1="170" x2="500" y2="140" stroke="#222" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="120" y="260" width="760" height="80" fill="none" stroke="#222" stroke-width="2" />
  <text x="500" y="300" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Update: w ← w + η(y−ŷ)x,  b ← b + η(y−ŷ)</text>

  <line x1="200" y1="260" x2="200" y2="140" stroke="#222" stroke-width="2" marker-end="url(#arrow)" />
</svg>
